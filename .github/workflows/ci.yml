name: CI

# Every push and pull request: the analyser and the whole test suite. A push to
# main also publishes the release APK as a GitHub Release, so anyone can download
# and install it without a Flutter toolchain and without digging through artifacts.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: analyse and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          # Pinned to what the app is developed against, so a stable release
          # cannot quietly change the result of a run.
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  release:
    name: release apk
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to create the release
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.0
          channel: stable
          cache: true
      - run: flutter pub get
      # Signed with the debug key on purpose: this is a prototype, and a real
      # keystore does not belong in a workflow file.
      - run: flutter build apk --release

      - name: Publish the APK as a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v1.0.${{ github.run_number }}"
          cat > notes.md <<'EOF'
          **AquaAlert — Spot the Leak. Save the Water.**

          Community water-leak reporting for UN SDG 6. Built from the commit below;
          analyser and the full test suite passed before this was published.

          **Install:** download `app-release.apk`, open it on an Android phone and
          allow installs from unknown sources when asked. No account or network is
          needed — three demo accounts are already on the sign-in screen, and the
          join code for Maxfort Pitampura is `MX7412`.
          EOF
          gh release create "$tag" build/app/outputs/flutter-apk/app-release.apk \
            --title "AquaAlert $tag" \
            --notes-file notes.md \
            --latest
